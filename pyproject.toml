[project]
name = "visaguide"
version = "0.1.0"
description = "RAG assistant for international students: study visas and residence permits (Germany, Türkiye), answered only from cited official sources."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "truststore>=0.9",
    "numpy>=1.26",
    "torch>=2.3",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
]

# CPU-only PyTorch: the default wheel bundles CUDA (~2.5 GB), which we don't need
# for embedding a few thousand short chunks, and which would bloat the Docker image.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visaguide"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: loads real ML models (run with -m slow; skipped in CI)"]
addopts = "-m 'not slow'"
