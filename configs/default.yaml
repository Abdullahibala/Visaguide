# All tunable settings live here; secrets come from .env (see config.py).
paths:
  sources: data/sources.yaml
  raw_dir: data/raw
  processed: data/processed/docs.jsonl
  manifest: data/manifest.csv
  index_dir: data/index      # one sub-folder per chunking strategy

ingest:
  # Generic client name, no personal contact details.
  user_agent: "VisaGuideResearchBot/0.1 (non-commercial student research project)"
  timeout_s: 30
  delay_per_domain_s: 2.0   # politeness: at most one request every 2 s per host
  min_chars: 400            # docs shorter than this are flagged (likely JS shells / error pages)

chunking:
  # Sizes are in words. 200 English words is roughly 260-300 tokens, safely under the
  # 512-token input limit of both the embedding model and the cross-encoder, so
  # nothing gets silently truncated.
  fixed:                    # strategy A: sliding window, ignores document structure
    size_words: 200
    overlap_words: 40       # 20% overlap, so a fact split by a boundary is complete in one chunk
  structure:                # strategy B: split at headings, pack whole paragraphs
    max_words: 200
    min_words: 40           # a section shorter than this merges into the next one

retrieval:
  embedding_model: BAAI/bge-small-en-v1.5
  # bge was trained with this instruction on queries (not on passages): asymmetric retrieval.
  query_prefix: "Represent this sentence for searching relevant passages: "
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  candidates: 50            # top-N from each retriever before fusion
  rrf_k: 60                 # RRF constant from Cormack et al. (2009)
  rrf_weights: [1.0, 1.0]   # [dense, bm25]; tuned on the dev split only
  rerank_top_n: 30          # how many fused candidates the cross-encoder re-scores
  # What the answer pipeline uses. Chosen on the dev split (docs/retrieval_findings.md).
  default_chunking: structure
  default_mode: dense_rerank
  top_k: 5                  # chunks given to the LLM

generation:
  provider: anthropic       # swap provider/model here; see generation/llm.py
  model: claude-opus-5-5
  effort: medium            # low | medium | high | xhigh | max (thinking depth & spend)
  max_tokens: 16000         # ceiling incl. thinking; you only pay for tokens used
  fallbacks: true           # server-side refusal fallback (beta)

judge:                      # LLM-as-judge for answer metrics
  provider: anthropic
  model: claude-opus-5-5
  effort: medium
  max_tokens: 16000
  fallbacks: true

# USD per million tokens, from the provider's price list (checked 2026-11-18).
# cache_write = 1.25x input (5-minute cache). Cost per query = usage x these prices.
pricing_usd_per_mtok:
  claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50}
  claude-haiku-5-5:  {input: 0.10, output: 0.50,  cache_read: 0.01, cache_write: 0.125}
