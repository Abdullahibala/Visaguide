- id: q001
  question: How many days per year am I allowed to work as an international student in Germany without asking the employment agency?
  answerable: true
  country: germany
  type: factoid
  answer: 140 full days or 280 half days per year, without approval from the Federal Employment Agency.
  gold:
  - doc: ge_643a3383e5
    quote: International students from other countries are allowed to work 140 full days or 280 half days per year.
    group: a
  - doc: ge_4c2aa9f5cc
    quote: may work 140 days or 280 half-days per year without needing the approval of the Employment Agency
    group: a
  - doc: ge_6b724137d0
    quote: you may take up employment that must not exceed a total of 140 days or 280 half-days per year
    group: a
  - doc: ge_830d5956b0
    quote: the temporary residence permit only entitles the holder to employment of up to a total of 140 working days per year
    group: a
  - doc: ge_9201dafe31
    quote: It entitles the holder to work for a total of 140 full work days in a calendar year.
    group: a
  notes: KIT (ge_2587be0acc) still states the outdated 120/240-day limit, so it is deliberately not an alternative.

