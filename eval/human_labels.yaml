      access** to the German labour market and have practically the same rights as German students. However,
      if they work more than 20 hours per week they must pay certain insurance contributions (just like
      German students). For students from other countries, special legal regulations apply:


      1. International students from other countries are allowed to work 140 full days or 280 half days
      per year. Self-employed work or freelancing is only possible if permitted by the Ausländerbehörde.

      2. Students who want to work more need permission from the (Federal Employment Agency) and the (foreigners''
      office), which in turn will ask the Agentur für Arbeit (employment agency). Permission can only
      be granted in cases of special financial need.'
