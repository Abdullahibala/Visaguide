- id: q008
  question: Can I start attending classes at a German university before completing its enrolment process?
  reference_answer: No. Enrolment is required before studies commence.
  answer: 'No. You are only allowed to attend courses at a German university once you are officially enrolled
    (matriculated) [S1][S5]. Accepting a study place is not enough: you officially become a student only
    when you enrol [S2]. After enrolment you can start attending classes and take exams [S3]. Practical
    steps: Your letter of acceptance gives the enrolment procedure, dates and required documents (typically
    proof of health insurance, semester fee receipt, passport photo, ID/passport) [S3]. Enrolment deadlines
    are often short, and if you are late or forget documents you will not be able to enrol [S6]. In many
    cases you must enrol in person, so arrive in Germany before the deadline [S2]. Please confirm details
    with your university''s international or admissions office; this is not legal advice.'
  sources:
    S1: 'With matriculation – enrolment – your studies officially begin.


      The certificate confirming enrolment is called an “Immatrikulationsbescheinigung”. It’s an important
      document that you’ll need on future occasions.


      Start to prepare


      All students have to enrol at university before they can commence their studies. The enrolment period
      is often quite short. After you have enrolled, you will receive a student ID.


      Before you can begin studying, you first have to enrol. This procedure is called enrolment or matriculation.
      Once you’re officially enrolled, you are allowed to attend courses at university, take examinations
      and obtain an academic degree. Enrolment allows you to gain access to all the facilities at the
      university. Students are normally required to enrol in person at the Office of Student Affairs („Studentensekretariat“)
      at the university.


      You may enrol if you have received notification of admission from your German university. If the
      university accepts your for a study place, it will send you the by mail. The letter also includes
      information concerning the enrolment period.


      The enrolment period is often quite short! You will need to present various documents for enrolment.'
    S2: "51\nSTUDYING IN GERMANY\nor flat once you arrive, for example.\nYou will also come into frequent\
      \ contact\nwith the student union as your stay goes on,\nfrom lunch in the cafeteria to the sport\
      \ and\nlanguage courses which some student un-\nions offer. You can also access information\nand\
      \ advice on a range of issues here.\n2.2 \aENROLLING AT YOUR HIGHER\nEDUCATION INSTITUTION\nYou\
      \ don’t become a student when you get\naccepted onto a study programme. You\nofficially become a\
      \ student when you enrol.\nIn Germany this is known as ‘Immatrikula-\ntion’. At some higher education\
      \ institutions\nyou can do this online or by post, so you can\ncomplete this task before you even\
      \ get to\nGermany. However, in many cases you still\nhave to enrol in person at your higher edu-\n\
      cation institution. That makes it essential to\nget to Germany before the deadline."
    S3: "You will find the details of the enrolment\nprocedure and the specific dates in your\nletter\
      \ of acceptance. It will also list the\ndocuments you need to enrol. Generally,\nthese are:\n\a\
      letter of acceptence\n\aproof of health insurance\n\areceipt for payment of the semester fee\n\a\
      passport photo\n\aID card/passport (and possibly your visa)\n\aand sometimes original copies of\
      \ exami-\nnation or degree certificates\nIf you have any questions, get in touch with\nthe international\
      \ office or the admissions\noffice at your higher education institution.\nThat way you can make\
      \ sure you have\neverything you need to enrol and that\nnothing will go wrong.\nOnce you have enrolled,\
      \ you will receive\nyour student ID card and your semester\nticket (if applicable). This usually\
      \ happens\nby post. Now you are officially a student\nat a German higher education institution!\n\
      You can start attending classes and take\nexams. You also have access to facilities\nsuch as the\
      \ institution’s library and sport-\ning facilities. You can also take advantage\nof discounted student\
      \ tickets for cultural\ninstitutions."
    S4: "50\nPREPARATION\nIN GERMANY\nTIPS\nOnce you have arrived in Germany you will\nneed to get several\
      \ things sorted out over\nthe first few days and weeks. If your higher\neducation institution only\
      \ accepts enrol-\nment in person, it’s essential to enrol before\nthe deadline. You may also need\
      \ to deal\nwith bureaucracy, especially if you need a\nresidence permit for Germany. You will also\n\
      have to choose the lectures and seminars\nyou are going to attend and make sure the\ntimetable is\
      \ possible.\nThis may seem like a lot of work, but you will\nrise to the challenge – and don’t forget,\
      \ you\ndon’t have to do it all on your own. You will\nfind many places where you can get help.\n\
      That’s what this chapter is all about. We\nwant you to get off to as smooth a start as\npossible\
      \ in Germany!\n2 \aYOU’VE ARRIVED IN\nGERMANY – WHAT’S NEXT?\nTIP: Try to plan your journey so you\
      \ don’t arrive in Germany on a weekend. The\ninternational office will be closed on Saturdays and\
      \ Sundays, as are banks and\nadministrative offices. It may also be difficult to get the key to\
      \ move into your\nstudent residence if"
    S5: 'Once you have enrolled, you will receive a certificate of enrolment which also serves as your
      provisional student ID. You will have to present this certificate of enrolment to apply for a at
      the Alien Registration Office. You will also receive an electronic payment slip with which you must
      pay the semester contribution and possible tuition fees. As soon as the university receives your
      payment, it will send you your official student ID card by post.


      Every student at university is issued a student ID card. You will need your card to use the library,
      dining hall, computer rooms, sports facilities, etc. The student ID frequently doubles as a ticket
      for public transportation in the university town. You can also receive special student discounts
      with your card, for example, on tickets to cultural events, swimming pools, museums and trade fairs.


      Only when you are enrolled (matriculated) are you allowed to attend courses at the university, take
      exams and obtain an academic degree.


      If you are spending more than one semester in Germany, you should definitely pay attention to the
      deadline for re-registration.'
    S6: '## How do I enrol?


      You can enrol at your German higher education institution as soon as you receive your from the International
      Office or the Stiftung für Hochschulzulassung. Information on when you have to matriculate will
      be included.


      Every higher education institution has its own rules. Usually you will have to go to the registrar''s
      office in person on a certain date. Sometimes it is also sufficient to send the necessary documents
      to your higher education institution by post within a certain deadline.


      **TIP:** The most important thing is to be sure you are fully informed. Enrollment deadlines are
      often short. If you are too late or forget documents you will not be able to enrol.'
    S7: 'enrol once the

      deadline has passed.

      As you can see, the letters of acceptance are

      sent out not long before the semester starts.

      If you wait until you receive the letter before

      getting on with your other preparations for

      studying in Germany, you can find yourself

      facing a lot of stress. You may even be un-

      able to get to Germany in time for the start

      of the semester. In this section, we’ll explain

      some of the things which you should get on

      with in advance.

      Funding

      Before you come to Germany, you need to

      make absolutely sure of how you will fund

      your studies. You will need to know which

      costs to expect and the different funding

      opportunities which are available. We’ll talk

      about those in the next few sections.

      But before we go any further: it is hard to

      give a general view of how much money you

      will need to live in Germany. It depends too

      much on where you are studying and your

      lifestyle.

      Nevertheless, we can say in general that

      Germany is not very expensive when

      compared to other European countries.

      Prices are higher in most of Germany’s

      immediate neighbours, while northern

      European countries and'
    S8: 'Anyone who wants to enrol at a German university must have health insurance.


      Depending on the country you come from, your health insurance may also be valid in Germany. Find
      out in good time.


      Check the requirements


      If you’d like to study in Germany, you have to have health insurance. You will need to present proof
      of health insurance when you enrol at university and apply for a residence permit. Make sure to
      take care of your health insurance status before you come to Germany.


      The first thing you should do is to find out whether your health insurance policy in your home country
      is also valid in Germany. Private domestic and foreign health insurance policies from other countries
      may also be recognised in Germany. You should inquire about the details with your health insurance
      provider before leaving home.'
