    S4: '##### I am a foreigner, I am a student at a university in Türkiye, I have a compulsory internship
      due to the department I am studying, do I need a work permit for this?


      It is necessary to apply for work permit exemption for internships that are required as a part of
      university education. In accordance with Article 48 of the Implementing Regulation, a work permit
      exemption can be issued for "foreign students enrolled in a formal education program in Türkiye
      who are obliged to do an internship with an employer within the scope of vocational training in
      accordance with the relevant legislation, during the compulsory internship".'
    S5: 'Once you get a work permit in Türkiye, that permit is counted as a residence permit, and you
      do not need to apply for a residence permit until the expiry date of your work permit.


      If it is found out that you work in Türkiye without an official work permit, your residence permit
      could be canceled by the Migration Office.'
    S6: '## Work Permits


      ## Students:


      **Your residence permit does not automatically give you the right to work in Türkiye.** You need
      an official work permit to work in Türkiye. The work permit is not something individuals can apply
      for individually. The company that wants to hire you should apply for your work permit. In other
      words, inTürkiye, you first need to find a job, and then the company should apply for a work permit
      for you.


      - Students at the undergraduate level can only get a work permit after they complete their first
      year at the university.

      - Students at the undergraduate level can only get a work permit for part-time jobs.

      - Students at the undergraduate level can only get a work permit for jobs outside of the university/campus.


      - Students at the graduate level can get a work permit starting from their first year at the university.

      - Students at the graduate level can get a work permit for both full-time and part-time jobs.

      - Students at the graduate level can only get a work permit for jobs outside of the university/campus.'
    S7: '**4. Exceptions to employment and financial eligibility criteria**


      4.1 For applications for a domestic work permit submitted on behalf of foreigners who, as of the
      date of the work permit application, have legally resided in Türkiye for at least one year within
      the preceding three years under a work permit, residence permit, or international protection status,
      it is a fundamental principle that the employment and financial eligibility criteria shall not be
      applied. This exemption is limited to a maximum of three foreigners falling within this category.
      *(Effective as of August 3, 2026.)*


      4.2. It is essential that the number of foreigners working with a work permit in workplaces under
      the first paragraph does not exceed the number of Turkish citizens employed in the same workplace.


      4.3. Provided that the relevant legislation provisions for foreigners under international protection
      are reserved, if more than three foreigners meeting the conditions in the first paragraph are to
      work in the same workplace, the evaluation of work permit applications for the fourth and subsequent
      foreign employees must meet the employment and financial eligibility criteria for each foreigner
      employed in the workplace.'
    S8: '**4. Aviation industry**


      4.1. Work permit applications for foreigners, who work as senior executives or in specialist positions
      for the foreign flag carrier airlines’ Türkiye branches, will not be subject to employment and financial
      eligibility criteria.


      **5. High-tech industry**


      5.1. For qualified investments that are committed to making a significant contribution to the national
      economy or creating a high number of jobs, or in cases where there is a need for qualified workforce
      due to the nature of the job and the unavailability of Turkish citizens with the same qualifications,
      work permit applications may be exempt from the general evaluation criteria, subject to approval
      by the Directorate General of International Labour Force.


      5.2. For foreigners working as R&D, innovation, and design personnel in companies with R&D or design
      center certificates under Law No. 5746 on the Support of Research, Development, and Design Activities,
      and for foreigners working in technology development zones under Law No. 4691 on Technology Development
      Zones, the approval of the Ministry of Industry and Technology is required. Employment and financial
      eligibility criteria will not applied in the evaluation of work permit applications in this context.'
