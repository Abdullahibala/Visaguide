- id: q088
  question: Can I get a German residence permit just to do an intensive English course?
  reference_answer: No. A residence permit can't be issued for an intensive course to learn a foreign
    language such as English.
  answer: No. According to the sources, a German residence permit cannot be issued for an intensive course
    to learn a foreign language such as English [S1][S3]. This applies even if the degree programme you
    want to study is offered only in that foreign language [S1][S3]. By contrast, preparatory language
    courses count as study preparation only when admission to your course of study is tied to attending
    one [S3]. Intensive German courses taken for this purpose must run at least 18 hours a week and must
    not be publicly funded [S1]. If you want to come mainly to learn German, a separate short-term intensive
    language course option exists, requiring daily instruction of at least 18 hours per week and secured
    means of subsistence [S5]. Please confirm your situation with the German mission or the responsible
    foreigners' authority, as this is not legal advice and rules can change.
  sources:
    S1: '**Please note the following:**


      - As a general rule, it is not possible to do remedial studies in Germany in order to meet the general
      educational preconditions for enrolling on the intended course of studies.

      - The German classes taken must be intensive courses, with at least 18 hours a week, and they may
      not be publicly funded. Evening, weekend and distance learning courses do not meet the requirements.

      - A residence permit cannot be issued for an intensive course to learn a foreign language (e.g.
      English). This applies even if the desired course of studies is offered only in this foreign language.'
    S2: '# Residence permit - Study preparation


      If you are preparing to study in Germany with an intensive German course, preparatory college or
      pre-study internship, you will need a residence permit.


      A residence permit for preparatory studies requires that you hold either a qualification for university
      entry or a conditional offer of a place at university.


      A residence permit for preparatory studies may be granted for a maximum of 2 years, for attending
      a preparatory language course for a maximum of 18 months, and for attending a Studienkolleg for
      a maximum of 1 year. It is not possible to extend the permit beyond these periods for the same purpose.'
    S3: '# Residence permit for the purpose of full-time studies


      A foreign student is granted a residence permit for full-time studies at a state-recognised university
      or a comparable educational institution in Germany.


      The purpose of stay for the studies also includes preparatory measures and the completion of a compulsory
      internship. Preparatory measures for the studies are


      - attending a preparatory language course, if admission to the course of study is tied to attending
      a preparatory language course, and

      - attending a preparatory college or comparable institution.


      A residence permit cannot be issued for an intensive language course to learn a foreign language
      (e.g. English). This also applies if the desired course of study is only offered in this foreign
      language.


      The residence permit is generally granted and extended for two years. It entitles the holder to
      work for a total of 140 full work days in a calendar year. Self-employment is also permitted as
      a secondary occupation (see section “More information”).'
    S4: '# Studies, including preparatory college and language courses for intended studies


      **General Information**


      If you intend to participate in a German language course in Germany that is not meant to prepare
      you for university studies, this is not the correct visa type for you. If you wish to do an intensive
      German course to prepare you for your vocational training, please refer to the information on vocational
      training visa. If you wish to do an intensive German course just because you wish to learn German,
      please refer to the information on “language course” in the section on non-CSP applications.


      Visa to study in Germany also have a number of sub-types, so as a first step in the Consular Service
      Portal, you will be asked to complete a **questionnaire**. The answers from this questionnaire will
      determine which sub-category of this visa type applies to you. You need to answer the question truthfully.
      Answers that do not match your situation will lead to a request to delete your process and start
      over again with correct answers. It is not possible to change the sub-type without starting the
      process over.'
    S5: '10

      Studying and Working in Germany

      One option is as part of a temporary student exchange. This requires an

      agreed exchange with a German school or a student exchange organiza-

      tion recognized in Germany and a secured means of subsistence during

      your stay.

      The other option is participating in an intensive language course if you are

      planning a short-term stay to learn German. This requires daily instruc-

      tion and the language course running for at least 18 hours per week. Your

      means of subsistence must also be secured, for example by your parents

      assuming all costs.

      Regular school attendance for children from third countries is only pos-

      sible as part of a family reunification and family immigration programme

      (see also Chapter III), or if the residence is based on another, independent

      right of residence. There are also exceptions made on a case-by-case basis,

      such as to attend a boarding school. Please contact the proper Aliens Au-

      thority for your desired place of residence with such requests.

