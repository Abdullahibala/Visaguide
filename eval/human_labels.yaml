- id: q068
  question: If I have private health insurance in Germany, can I later switch to statutory insurance during
    my studies?
  reference_answer: DAAD says students with private insurance cannot change to statutory insurance during
    their studies.
  answer: 'It depends on how your private insurance is set up. If you use private insurance to be exempted
    from statutory insurance, you generally cannot switch to statutory insurance during your studies [S1][S6].
    Once a statutory provider issues the exemption confirmation, you are no longer allowed to join German
    public health insurance for the rest of your studies [S6].


    Private cover that only bridges the time before enrolment is different. Statutory student insurance
    can only start after you take up residence and enrol, so you need private insurance until then [S5].
    An Incoming-Health Insurance Package lets you move without a gap into long-term student insurance
    with a statutory or private provider [S7].


    The sources mainly describe home-country private insurance and the exemption process. Please confirm
    your own case with your insurer or a statutory provider before you decide. This is not legal advice.'
  sources:
    S1: '### Is my health insurance valid in Germany?


      Many international students do not need to obtain a new health insurance plan in Germany. You may
      be able to keep your home country’s health insurance if Germany has a with your home country. This
      mostly applies to students from the EU and the European Economic Area (Norway, Iceland, Liechtenstein).


      If you are from one of these countries and have statutory health insurance, it is possible to have
      it recognised in Germany. Private health insurance is also sometimes accepted. However, with private
      insurance, you will not be able to change to statutory health insurance during your studies.


      Regardless of whether you have statutory or private health insurance: Inform yourself by contacting
      your insurance provider in your home country whether your insurance is valid in Germany. You will
      usually need a . Additionally, you will also need a certificate proving that you are not required
      to take out German statutory health insurance. This certificate is issued by the statutory health
      insurance providers in Germany. The of your chosen higher education institution will surely support
      you in this process.'
    S2: '## Health insurance during your studies in Germany


      As mentioned before: Every person in Germany is required to have health insurance – and so are you!
      This applies not only to international students, but also if you participate in a preparatory course
      or a .


      There are two types of health insurance: private and statutory (in German: private und gesetzliche
      Krankenversicherung). Generally, private health insurance plans offer more benefits, but they are
      significantly more expensive and require advance payments. For this reason, most people are covered
      by statutory health insurance. Statutory health insurance providers are required to offer a basic
      plan which includes most doctor''s visits, a broad selection of medicines and, e.g., ER visits,
      ambulance rides and hospital stays. This basic coverage is always unchanged, no matter which statutory
      health insurance you choose.


      By the way, with , (international) students are also automatically insured through the higher education
      institution’s . The insurance covers e.g. all injuries during activities that take place on the
      institution’s grounds or that are organised by the higher education institution. However, it doesn’t
      replace your personal health insurance.'
    S3: In case your current health insurance isn’t recognised in Germany, you must obtain health insurance
      coverage once you arrive in the country or when you apply for a visa. If you are under 30 years
      of age, you will profit from a reduced student rate of about 120-130 euros per month, which is offered
      by statutory health insurance providers. As soon as you have reached 30, you will have to pay the
      standard contribution though, even if you are still studying. This normal contribution is often
      a lot more expensive than purchasing a student plan from a private insurance company. Therefore,
      it might be worth checking whether private health insurance could be the cheaper option for you.
      You could also research if there are any arrangements between the (Student Services) and insurance
      providers targeting students older than 30. For more information on this, you can also contact the
      local student services at your higher education institution in Germany.
    S4: 'When you decide on your health insurance, you can select from a wide choice of insurance providers.
      More information on statutory health insurance providers can be found on the website of the National
      Association of Statutory Health Insurance Funds. Here, you will also find a list of the various
      health insurance providers (only available in German). Regarding private health insurance providers,
      you can find more information online. As there are many of them, please check carefully which one
      you choose. The services offered vary, so it''s essential to ensure that a specific provider offers
      the coverage that matters to you.


      Another easy way for you to get insurance in Germany might be the service packages for international
      students offered by many local Studierendenwerke. Next to accommodation and meals they all include
      health insurance for Germany. Please refer to your local Studierendenwerk to see if this package
      is available at your place of study.'
    S5: 'If as a student you want to take out statutory health insurance, you must bear in mind that this

      insurance can only begin when you take up residence in Germany and after enrolment. If you

      enter Germany beforehand, private health insurance must be taken out for the period prior to

      enrolment and registering for statutory health insurance. In its terms and conditions, travel

      health insurance can exclude protection if a long-term or permanent stay is planned. So-called

      incoming travel insurance can also contain such exclusions.

      If applicable: for a preparatory language course/ preparatory college:

      Preparatory language course:

       Admission to the preparatory language course with at least 18 hours per week as well as

       Proof of admission to university following the successful language acquisition

       A1 certificate. A submitted language certificate must have been issued by an ALTE-certified

      institution

       Proof that fees have been paid

      Preparatory study college:

       Admission to preparatory study college as well as

       B1 certificate. A submitted language certificate must have been issued by an ALTE-certified

      institution

       Proof that fees have been paid

      In the case of preparatory language course or internship

       Acceptance for preparatory language course or internship

      Applicant of'
    S6: 'If your (public or private) health insurance policy from your home country is recognised, then
      you will need confirmation that you are exempted from public health insurance coverage when you
      . In this case, when you arrive in Germany and before you at your German university, contact a German
      health insurance provider in your town and have them issue you a letter certifying that you are
      insured. (It’s a good idea to ask the about which health insurance provider to contact). Bear in
      mind that once this confirmation is issued, you will no longer be allowed to sign up for German
      public health insurance for the duration of your studies!


      If your health insurance policy from your home country is not recognised in Germany, you will have
      to sign up for coverage in Germany. A public health insurance policy costs about 140 euros a month
      until you reach the age of 30. After that, the monthly premium jumps to 250 euros or more per month.
      For more detailed information, visit the .


      You already have health insurance that is recognised in Germany? Then a statutory German health
      insurance fund must confirm this.'
    S7: Everyone staying short-term or long-term in Germany must have **sufficient health insurance coverage**.
      Unlike university students, study-applicants cannot be a member of a German statutory health insurance
      provider (gesetzliche Krankenversicherung) and cannot benefit from their special student rates;
      this is only possible after formal university enrolment. You should preferably obtain a so-called
      Incoming-Health Insurance Package that covers you in case of illness from the moment you arrive
      in Germany and offers the possibility to later on change, without interruption, into a long-term
      student health insurance with a statutory or private health insurance provider. As an alternative
      to such package you can submit to us – after we have informed you that your visa application has
      been approved and that we are able to issue your study-applicant visa – proof of a travel health
      insurance package valid for the Schengen states for 90 days from the date of your entry. In this
      case you will, however, still need to obtain a long-term student health insurance in Germany later
      on.
    S8: 'There are a few exceptions: If you are doing a paid or have a part-time job while studying, then
      you will have to obtain coverage with a German provider. Your home-country insurance is not considered
      sufficient.


      ### Which German health insurance is right for me and what do they cover?'
  faithful: 'yes'
  correctness: correct
  faithful_shared_def: 'yes'
- id: q069
  question: How much should I budget per month for accommodation as a student in Türkiye?
  reference_answer: The guide gives a range of 215 TL to 2,500 TL per month, though this is a dated source
    estimate.
  answer: 'According to Study in Türkiye, you should reserve between 215 TL and 2500 TL per month for
    accommodation, depending on whether you choose a state, university or private dormitory or a rental
    flat [S1]. Private dormitories usually offer better facilities than state dormitories but cost more
    [S7]. Rental prices vary by city, location and the characteristics of the house [S7].


    Key points:

    - You pay dormitories monthly and do not pay in summer when you are not staying there. Rent for a
    flat, however, is paid all 12 months [S1].

    - Both dormitories and rental apartments require a deposit when you first move in, linked to the monthly
    fee or rent [S1].

    - If you hold a Türkiye Scholarship, accommodation is provided [S6]. Eligible graduate students can
    receive cash accommodation aid of 750 TL per month [S2].


    The sources do not say how current these figures are, so check them with your university''s accommodation
    office or the responsible authority before you plan.'
  sources:
    S1: '**Accommodation**


      Monthly budget you need to reserve for accommodation will vary between 215 TL and 2500 TL. State
      dormitories, university dormitories, private dormitories and rental flats each have varying costs.
      There is a monthly payment for dormitories and therefore you do not need to pay in the summer when
      you are not staying in the dorm. However, you will have to pay the house rent on a monthly basis,
      12 months of the year.


      For dormitories and rental apartments, a certain amount of deposit must be paid in the first entry.
      This amount may vary depending on monthly payment of the dorm or monthly rental of the apartment.


      Further information about accommodation can be found on Accommodation page or relevant office of
      your university.'
    S2: '• Applying

      to KYK Provincial Directorate for KYK dormitories


      • Applying

      to YTB for private, university and foundation dormitories


      •After

      graduation – a maximum of 2 months additional housing support can be provided.


      •After

      cancellation of scholarship – a maximum of 2 months additional housing support

      can be provided.


      Graduate

      students can be included in the cash accommodation aid in July of their first

      year in Turkey. The monthly cash accommodation aid is 750 TL.


      •Students

      staying in NGO dormitories (graduate students only) – Automatically at the end

      of the first year


      •Students

      staying in KYK dormitories (only postgraduate students) – At the end of the

      first year, if students make a request and waive their dormitory rights.'
    S3: 'You should budget at least 1,100 euros per month for living expenses when studying at RWTH Aachen
      University:


      | Monthly Expenditure | Minimum Costs per Month |

      |---|---|

      | Accommodation and associated costs | between 400 and 600 euros |

      | Food | between 200 and 300 euros |

      | Health insurance | between 100 and 150 euros |

      | Study Materials (including books, printing etc) | between 20 and 40 euros |

      | Internet and Mobile Phone | between 20 and 50 euros |

      | Additional costs (clothing, hygiene etc.) | between 50 and 200 euros per month |


      A single person must prove a minimum monthly income of 992 euros to the Immigration Office in Aachen
      in order to have their residence permit extended.


      With the increase in the BAföG maximum rate to 992 euros per month, the amount for the proof of
      financial support to be provided by international students was increased, see section 2, paragraph
      3, sentence 5 of the Residence Act.'
    S4: '**Daily Expenditures**


      Student discount is offered at Cinema, theater, museum, public transport, some book houses and restaurants.
      Let us remind you that Turkish Airlines offers attractive discounts and special offers to students.


      You can see average prices of some basic needs below:


      <u>Book and Stationery Fees (yearly)</u>: 700 TL


      <u>Mobile Phone Bill (monthly): 60-100 TL</u>


      <u>Transportation & Entertainment</u>


      Bus/Metro ticket (One way): 1.75-3.50 TL


      Taxi (5 km): 20-25 TL


      Cinema Ticket: 15-25 TL


      Theater Tickets (State Theaters): 9-15 TL


      Opera/Ballet Tickets (State Opera and ballet): 20-25 TL


      Local music group concert 25 TL


      A popular music group concert 50-100 TL


      Football match ticket 20-200 TL


      <u>Food</u>


      Bread: 1-3 TL


      Water (0,5 lt): 1 TL


      Milk (1 lt): 5 TL


      Fruit juice (1 lt): 5 TL


      10 Eggs: 10 TL


      White cheese (1 kg): 40 TL


      Pasta (1 package): 3-7 TL


      Chicken (1 kg): 25-50 TL


      Red meat (1 kg): 45-100 TL


      Apples (1 kg): 10 TL


      <u>Dining & Drinking Out</u>


      A meal in cafeteria (State University): 3-10 TL


      Breakfast in University Canteen: 3-8 TL


      Tea in University Canteen: 1-3 TL


      Coffee in University Canteen: 3-5 TL


      Toast in University Canteen: 5 TL


      Soup: 5 TL


      Hamburger Menu: 20-25 TL'
    S5: 'Types of apartments and accommodation

      in Germany

      Many students live in student residences.

      These are especially popular among inter-

      national students, and over 40% have a

      room in a student residence. The rooms in

      these residences are furnished and, with

      average costs of €250 per month, they are

      fairly cheap. What’s more, you won’t be

      alone for long there, either, and will quickly

      get to know other people. Another benefit is

      that you can apply and sign the contract for

      a room while you are still at home.

      However, even if you apply early and inter-

      national students get slightly preferential

      treatment, you cannot be certain of getting

      a room. The number of applicants exceeds

      the number of available rooms several times

      over. The numbers speak for themselves:

      there are just under 240,000 publicly funded

      places in student residences, but there are

      2.5 million students! Submit your applica-

      tion early, as you don’t necessarily need to

      wait for your letter of acceptance.'
    S6: 'SUBSCRIBE!


      high-quality education in Türkiye!


      A Comprehensive and Unique Scholarship Program


      Türkiye Scholarships considers everything that international students will need during their academic
      studies while discovering Türkiye and acquiring new skills.


      \* Provides **university and department placements** unlike other higher education scholarship programs.


      \* **Covers** tuition fees.


      \* Allows you to learn the language of the country by studying **a 1-year Turkish language course.**
      Thus, resources are diversified in your academic research and daily life becomes more pleasurable.


      \* Provides **accommodation** for students arriving in a new country.


      \* Covers your **once-off flight ticket.**


      \* Allows you to take full advantage of widespread health services with **general health insurance.**


      \* Also provides **monthly stipend.** 6.500 TL at Associate’s and Bachelor’s levels, 9.500 TL at
      Master''s level and 13.000 TL at PhD level per month.'
    S7: '**Private Dormitories**


      It is possible to find private dormitories around most university campuses. The facilities offered
      by the private dormitories are mostly higher than the state dormitories (for example, newer and
      varied furniture), but their fees are higher.


      **Renting a House**


      Another accommodation option for international students is to rent a house. Especially in neighborhoods
      close to universities, many students rent a house with a few friends. You will have a lot of rental
      home options in Türkiye which is rapidly developing in terms of housing quality and number. Of course,
      prices vary from city to city and according to the location and characteristics of the house. However,
      regardless of your budget, you can be sure that you will find a suitable home in the city you go
      to.


      The houses in Türkiye are usually in the form of an apartment. These apartments have a large living
      room as well as 2 to 4 additional bedrooms. Most of the houses have a balcony. Kitchen is located
      as a separate part of the house. Heating of the houses is provided by a central system or a combi
      boiler.'
    S8: '**Insurance and Health Expenditures**


      Health insurance for international students varies between 300-500 TL per year in private policies.
      These private insurers allow you to receive free health services in contracted hospitals within
      the limits specified in the policy. It is important that you also obtain an English copy of your
      policy and read the relevant articles carefully.


      General Health Insurance payment is 1059 TL per year as of 2020. With this insurance you can get
      free health services in all state hospitals. In private hospitals you will need to pay varying amounts
      of contribution.'
