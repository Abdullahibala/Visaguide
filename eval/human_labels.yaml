      the local alien authority (“Ausländerbehörde”) may extend the visa in the form of a temporary residence
      permit for the purpose of applying for a course of study for a combined maximum duration of nine
      months. **When your visa application is lodged at our office it must be feasible and likely that
      you will begin your university studies in Germany within nine months of your arrival.** After successful
      university admission you can change your study-applicant visa into temporary residence permit for
      students. If your study application is not successful you must leave Germany before the expiry of
