- id: q067
  question: My German D visa runs out soon. When do I need to apply for the residence permit?
  reference_answer: Yes. Munich's guidance says to apply before the national D visa or current residence
    permit expires.
  answer: 'Apply as soon as possible, and well before your D visa expires. The exact deadline depends
    on your local Foreigners'' Office, and the sources differ:


    - FU Berlin: at least eight weeks before your visa expires [S1].

    - KIT and TUM: at least 6 weeks before expiry, soon after registering your address [S2][S3].

    - RWTH Aachen: no later than one month before expiry [S4].

    - DAAD: within three months of arriving in Germany [S5].


    In Berlin, the official Service Berlin page says you apply only online, and no earlier than 4 months
    before your current title expires [S6]. All sources were retrieved on the same date, so check your
    own city''s office.


    Once you have applied, you can stay in Germany while you wait for your appointment, even if your visa
    expires ("Fiktionswirkung") [S2][S3]. Keep your visa and the office''s confirmation as proof [S2].


    This is not legal advice; confirm the deadline with your local Foreigners'' Office.'
  sources:
    S1: 'APPLYING FORA RESIDENCE PERMIT

      All students with a non-EU and non-EFTA (Andorra, Iceland, Liechtenstein, Norway) citizenship have
      to apply for a residence

      permit as soon as possible or at least eight weeks before their visa expires or your 90-day period
      (in case you entered Germany

      without a visa*) at the Foreigners'' Office (Aus/änderbehdrde) in Berlin.

      Applying directly at LABO — Foreigners'' Office (Aus/änderbehörde)

      You may arrange an appointment with the Foreigners'' Office (Aus/änderbehörde) online at the following
      address:

      http.//tinyur/.cοm//αbο-termin. Please note that online appointments are usually booked out months
      in advance! You may also

      submit your application at the Foreigners'' Office (Aus/änderbehörde) without arranging an appointment.
      Their office is located

      here:

      https.//www. berlin. de/staο''tρΙan/νerwa/tυng/aυsΙaenderbehοerιΙe-ber/ιn-standοrt-keρ/erstr/ and
      their office hours are: Mon, Tue

      o7:oo-14:oo and Thu 1o:oo-18:oo. Please arrive early and expect very long waiting times if you decide
      to go there without an

      appointment.

      Applying through the FU Pass-Service

      In case you need a permit you also have the possibility of applying for a residence permit avia
      the international office of the

      university. The following documents are generally required to submit an application at our office:

      Ίi

      application form (AntragaufErteilungeinesAufentha/tstite/s/Antragaufein en befristetenAufentha/tstite/)

      On request we can send you this form via'
    S2: '**Important Information About Your Residence Permit**


      - **Here, you can find a step by step guide.**

      - Apply as soon as you have registered your address, and at least 6 weeks before your visa or current
      permit expires.

      - After submitting your application, you can stay in Germany while waiting for your appointment,
      even if your visa expires. This is called “Fiktionswirkung.” Proof: your visa/previous permit +
      confirmation from the Foreigners’ Office.

      - You can travel within the Schengen Area during the first 90 days.

      - Do not leave Germany after the initial 90 days unless you already have a residence permit.'
    S3: '**Please note:** It is advisable to apply for a residence permit soon after registering your
      residence (but at least 6 weeks before your visa / residence permit expires), since you may have
      to deal with considerable delays at some Foreigners'' Offices. You are entitled to stay in Germany
      while waiting to get an appointment, even if your visa / previous residence permit expires (so-called
      "Fiktionswirkung" - proof: visa + Foreigners'' Office''s confirmation of receipt of your application).
      However, students who entered Germany without a visa must not travel outside of Germany after the
      permitted duration of their visa-free stay without a residence permit (i. e. they must stay in Germany
      until obtaining their residence permit).'
    S4: '### When and how do I apply for a residence permit?


      If you are not from an EU country (with the exception of Iceland, Liechtenstein, or Norway) and
      arrived in Germany on a student visa, you must apply for residence permit no later than one month
      before your visa’s date of expiration. The Immigration Office of the Aachen city region is responsible
      for this. You can find all the necessary information (contact information, documents, opening hours)
      on the page Applying for and Extending Your Residence Permit.


      Sometimes the Immigration Office requires an academic progress certificate in order to extend the
      residence permit. You can find additional information about requesting this certificate as well
      as general information about right of residence on the page Residence Permit.'
    S5: "54\nPREPARATION\nIN GERMANY\nTIPS\nYou apply to the immigration office for your\nresidence permit.\
      \ You must do this within\nthree months of arriving in Germany, and\nyou must do it in-person at\
      \ the appropriate\noffice.\nYou will usually have to provide the follow-\ning documents:\n\apassport\
      \ (including your visa if necessary)\n\aconfirmation of registration with the\nresidents registration\
      \ office\n\aproof of health insurance\n\acertificate of enrolment\n\aYou may also need: proof of\
      \ sufficient\nfunds, health certificate, rental contract,\nand a biometric passport photo\nFind\
      \ out in advance which documents you\nwill need – you can check on the immigra-\ntion office’s website\
      \ for this. Make absolute-\nly sure to take all these documents to your\nappointment: it is better\
      \ to take too many\nthan too few! If you are missing anything at\nyour appointment you will usually\
      \ need to\nmake a new one.\nYou also need to factor in the fee which you\nhave to pay at the office,\
      \ which is usually\naround €100. Find out the fee in advance in\nthe immigration office which is\
      \ responsible\nfor your area.\nContact your international office, where you\nwill find good and\
      \ experienced people to talk\nto on questions about residence"
    S6: '- Only online and at the earliest 4 months before your current residence title expires

      - You will receive a PDF document to confirm your application. This document will certify that your
      current residence title (national D visa or residence permit) remains valid in the federal territory
      beyond the previous validity date. (This does not apply if you hold a Schengen visa (C visa) for
      a short-term stay).

      - The following applies to nationals of the beneficiary countries under Section 41 of the Ordinance
      Govering Residence (see section “More information”): Did you arrive in Germany fewer than 91 days
      ago and are now applying for a residence permit for the first time? Then your residence in Germany
      is considered lawful until a decision is made on your application. This means that you can begin
      your studies or the preparatory measures for your studies. However, you are not yet permitted to
      start work.

      - Please therefore make sure to save this document and print a copy if possible.

      - In the case of an application being filed by an authorised representative: power of attorney stating
      the subject matter of the procedure

      -

      Passport copies (in color)'
    S7: '## Visa-free travel


      British nationals do not require visas or residence permits for study or research visits not exceeding
      90 days within a 180-day period - provided that they do not pursue any economic activity. This privilege
      also applies to all other nationals who do not require visas for visits not exceeding 90 days.


      For any stay exceeding the time limit above, British citizens may apply to the local immigration
      office (*Ausländerbehörde*) for their residence permit after arrival in Germany and **without having
      obtained a visa prior to travelling to Germany**. Please note that any application for a residence
      permit needs to be filed within the first 90 days of your stay in Germany. **We strongly recommend
      contacting the local immigration office as soon as possible after your arrival in Germany in order
      to secure a timely appointment**. The visa-free privilege is also extended to citizens of Andorra,
      Australia, Brazil, Canada, El Salvador, Honduras, Israel, Japan, Korea (Republic), Monaco, New Zealand,
      San Marino and the United States of America.'
    S8: '**Additional information:**


      If your application is successful, you will be issued a limited validity entry visa - similar to
      a UK entry clearance. Students on a year abroad/exchange placement may be issued a visa covering
      their entire stay. Please make sure to check the validity of your visa! Once you have arrived in
      Germany, please register your new residence with the local authorities (*Meldebehörde*) within 2
      weeks of having moved in and apply to your local immigration office (*Ausländerbehörde*) for your
      Electronic Residence Permit. **We strongly recommend contacting the local immigration office as
      soon as possible after your arrival in Germany in order to secure a timely appointment.**


      Further information on studying in Germany is available here.


      Further information on living and working in Germany is available here.'
