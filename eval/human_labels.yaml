      ... and I want to complete a professional training programme

      (Residence title under section 16 subs. 5 Residence Act)

      A residence permit may'
    S6: '(4) A foreigner who is not, or is no longer, entitled to take an integration course may be allowed
      to do so if space is available in the course concerned. This provision applies accordingly to German
      nationals who do not have a sufficient command of the German language and have special integration
