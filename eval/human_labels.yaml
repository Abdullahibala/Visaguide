- id: q089
  question: How early can I apply online to extend my study residence permit in Berlin, and what does
    the confirmation I get do?
  reference_answer: At the earliest 4 months before the current permit ends. The PDF confirmation certifies
    that your current D visa or residence permit stays valid beyond its expiry date while the application
    is processed.
  answer: In Berlin, you apply for your study residence permit only online, and at the earliest 4 months
    before your current residence title expires [S1][S3]. You must pay the service fee before you can
    send off the application [S3]. At the end, you receive a PDF confirmation, which certifies that your
    current residence title (national D visa or residence permit) stays valid in Germany beyond its previous
    validity date [S1][S3]. This does not apply if you hold a short-term Schengen (C) visa [S1]. Save
    this document and print a copy if possible [S1]. Also apply before your current permit expires, and
    keep proof from your university that your studies are progressing regularly, since the extension depends
    on it [S4]. Please confirm the details with the Berlin Immigration Office, as rules can change and
    this is not legal advice.
  sources:
    S1: '- Only online and at the earliest 4 months before your current residence title expires

      - You will receive a PDF document to confirm your application. This document will certify that your
      current residence title (national D visa or residence permit) remains valid in the federal territory
      beyond the previous validity date. (This does not apply if you hold a Schengen visa (C visa) for
      a short-term stay).

      - The following applies to nationals of the beneficiary countries under Section 41 of the Ordinance
      Govering Residence (see section “More information”): Did you arrive in Germany fewer than 91 days
      ago and are now applying for a residence permit for the first time? Then your residence in Germany
      is considered lawful until a decision is made on your application. This means that you can begin
      your studies or the preparatory measures for your studies. However, you are not yet permitted to
      start work.

      - Please therefore make sure to save this document and print a copy if possible.

      - In the case of an application being filed by an authorised representative: power of attorney stating
      the subject matter of the procedure

      -

      Passport copies (in color)'
    S2: 'APPLYING FORA RESIDENCE PERMIT

      All students with a non-EU and non-EFTA (Andorra, Iceland, Liechtenstein, Norway) citizenship have
      to apply for a residence

      permit as soon as possible or at least eight weeks before their visa expires or your 90-day period
      (in case you entered Germany

      without a visa*) at the Foreigners'' Office (Aus/änderbehdrde) in Berlin.

      Applying directly at LABO — Foreigners'' Office (Aus/änderbehörde)

      You may arrange an appointment with the Foreigners'' Office (Aus/änderbehörde) online at the following
      address:

      http.//tinyur/.cοm//αbο-termin. Please note that online appointments are usually booked out months
      in advance! You may also

      submit your application at the Foreigners'' Office (Aus/änderbehörde) without arranging an appointment.
      Their office is located

      here:

      https.//www. berlin. de/staο''tρΙan/νerwa/tυng/aυsΙaenderbehοerιΙe-ber/ιn-standοrt-keρ/erstr/ and
      their office hours are: Mon, Tue

      o7:oo-14:oo and Thu 1o:oo-18:oo. Please arrive early and expect very long waiting times if you decide
      to go there without an

      appointment.

      Applying through the FU Pass-Service

      In case you need a permit you also have the possibility of applying for a residence permit avia
      the international office of the

      university. The following documents are generally required to submit an application at our office:

      Ίi

      application form (AntragaufErteilungeinesAufentha/tstite/s/Antragaufein en befristetenAufentha/tstite/)

      On request we can send you this form via'
    S3: '- The application is possible at the earliest 4 months before the end of your current residence
      title.

      - Please have all the necessary documents ready for this in PDF format if possible. However, you
      can also still photograph and upload the documents during the application process using your smartphone
      or tablet. The following file formats are accepted: PDF, JPG, JPEG, and PNG. The total size of your
      files must not exceed 100 MB. A single file must not exceed 7 MB in size.

      - Before you can send off the application, you need to pay the service fee.

      - At the end you will receive a PDF document to confirm your application. This document will certify
      that your current residence title (national D visa or residence permit) remains valid in the federal
      territory beyond the previous validity date. (This does not apply if you hold a Schengen visa (C
      visa) for a short-term stay).

      - The following applies to nationals of the beneficiary countries under Section 41 of the Ordinance
      Govering Residence (see section “More information”): Did you arrive in Germany fewer than 91 days
      ago and are now applying for a residence permit for the first time? Then'
    S4: 'When you first apply, you have to pay a fee of up to €110. The extension costs up to €100.


      After four to six weeks you can personally pick up your residence permit from the foreigners’ registration
      office. It is initially issued for at least one year and no more than two years, but it can be extended.
      The extension depends on your studies progressing “regularly” (meaning you should adhere to the
      standard period of study). You need documentation from your university to show this. It is imperative
      that you apply for the extension before your current residence permit expires!


      It is important to observe the deadlines when registering and applying for a residence permit.


      If you need to apply for a residence permit, it is better to have more documents ready than you
      might need – this will save you unnecessary delay.'
    S5: 'All international students must register at the local Residents‘ Registration Office – usually
      within one week.


      Whether you need a residence permit depends on your country of origin.


      Upon arrival


      As soon as you have found accommodation, you have to register with the local Residents'' Registration
      Office. The office gives you a written confirmation of Registration (Meldebestätigung). After that,
      you can apply for your residence permit.


      Every international student who moves to Germany has to register with the residents‘ registration
      office – usually within one week. At the Residents‘ Registration Office you have to fill out a registration
      form. Then you receive a written confirmation of registration. Be sure to keep this document because
      you will need it to obtain a residence permit from the foreigners’ registration office.'
    S6: 'nationals of the beneficiary countries under Section 41 of the Ordinance Govering Residence (see
      section “More information”): Did you arrive in Germany fewer than 91 days ago and are now applying
      for a residence permit for the first time? Then your residence in Germany is considered lawful until
      a decision is made on your application. This means that you can begin your studies or the preparatory
      measures for your studies. However, you are not yet permitted to start work.

      - Please therefore make sure to save this document and print a copy if possible.

      - **Note:** Do your spouse and child live with you in Berlin and need a residence permit? Then please
      do not submit a separate application for them. Simply enter your family members in the spaces provided
      in the online application. The Berlin Immigration Office will contact you regarding residence permits
      for your family members.'
    S7: 'An extension of the residence permit for more than 18 months for the purpose of further job search
      is not possible. A new residence permit can only be issued for a different purpose of stay.


      **Procedure:**


      1. Carry out the online application.'
    S8: '**Important Information About Your Residence Permit**


      - **Here, you can find a step by step guide.**

      - Apply as soon as you have registered your address, and at least 6 weeks before your visa or current
      permit expires.

      - After submitting your application, you can stay in Germany while waiting for your appointment,
      even if your visa expires. This is called “Fiktionswirkung.” Proof: your visa/previous permit +
      confirmation from the Foreigners’ Office.

      - You can travel within the Schengen Area during the first 90 days.

      - Do not leave Germany after the initial 90 days unless you already have a residence permit.'
