      Note: After entering Germany, you will have **no** access'
    S7: '# Welcome


      # Opening / unblocking a blocked account (for students only)


      Opening a blocked bank account in Germany and unblocking it: quick info


      For students, the living expenses in Germany can be proven in the visa procedure by opening a blocked
      account. You are free to choose the bank. You can find providers who offer this service worldwide
      on the website of the German Foreign Office.


      You would like to remove the blocking note on your account as you are not travelling anymore?


      The German Embassy Colombo can issue a consular certificate in order to unblock your blocked account
      with your German bank if you have


      • not applied for a visa to enter Germany,


      • applied for a visa but withdrew the application,


