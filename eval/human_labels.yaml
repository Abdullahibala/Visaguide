- id: q035
  question: Can students from outside the EU simply exceed the German student work-day limit if they find
    more shifts?
  reference_answer: They need permission from the Federal Employment Agency to work more than the stated
    140 full or 280 half days.
  answer: 'No. As a non-EU student you may work 140 full days or 280 half days per calendar year without
    approval [S3][S6]. If you want to work more, you need approval from the employment agency and the
    immigration office (Ausländerbehörde) [S3][S4]. Sources describe this permission as limited: DAAD
    says it is granted only in cases of special financial need [S4], and TUM says exceptions are made
    only in individual cases, with no automatic right [S1]. Working beyond 140 days off campus without
    a permit can bring a fine of up to 5,000 euros and a check on revoking your residence permit [S8].
    Both you and your employer must check whether the 140 days are used up [S8]. The limit resets only
    in January, not when you extend your permit [S2]. Part-time on-campus student jobs are allowed throughout
    the year [S1][S6], and research assistants at universities are exempt but must inform the immigration
    office [S3]. This is not legal advice; confirm with your Foreigners'' Office.'
  sources:
    S1: '## 8. Find a part-time job


      Foreign students enrolled in a German university may work up to a maximum of 140 full days per calendar
      year. Additionally, part-time student employment at a school of higher education is permitted throughout
      the year. However, for this you require the **authorization pursuant to immigration law from the
      Foreigners’ Office in your residence permit** (Section 16b, para 3 AufenthG, German Residence Act).
      Any employment beyond this will generally not be possible. Exceptions can only be made in individual
      cases for temporary hardships or with a special justification. However, students do not have an
      automatic right to this exception.


      EU students from the "old" EU states are normally permitted to work for an unlimited period of time
      (within the scope of the general provisions for students); citizens of the "new" EU states (accession
      from 2004 on) require permission from the employment agency for employment for more than 120 days.


      In case of an employment relationship (e.g. Mini job, Hiwi-job, working student) during an exchange
      stay to at least finance themselves on a partially part, there is an obligation to have health insurance.'
    S2: '2. during the lecture period you can work up to 20 hours a week. This will then be

      counted as two and a half days on your workday account. You are free to distribute

      the working hours within the week;

      3. outside the period of lectures you can work without restriction. These working

      hours are then counted as two and a half days on your working day account.

      Night shifts of a maximum of eight hours count as one working day. This means

      that you can also have fixed student jobs - e.g. three working days a week for 40

      weeks a year. The only days counted are those on which you do in fact work. Paid

      or unpaid holidays and sick days are therefore not counted towards the 140 days

      or 280 half days. When calculating the annual period, the calendar year is essential.

      This applies regardless of when you arrive in Germany or when you complete your

      studies. So, if you have already worked for 140 days in October and then decide to

      extend your residence permit, you will not receive a new 140 days, but will be

      allowed to work again in January of the following year.'
