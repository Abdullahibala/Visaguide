    S5: 'As you need **your passport** for applying for a blocked account you should complete this step
      prior to your visa interview at our office. To ensure quick processing of your visa application,
      you should submit the proof of your blocked account during your visa interview.


      The **visa processing fee** is 75,- € payable in NT$ at the time of your visa interview. After receiving
      an application, we cannot refund any visa processing fees irrespective of the decision taken on
