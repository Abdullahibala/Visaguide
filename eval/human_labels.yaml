- id: q037
  question: If my Turkish visa allows a longer visit, can I stay more than 90 days in any 180-day period?
  reference_answer: No. The permitted stay cannot exceed 90 days within each 180-day period.
  answer: 'No. With a visa you can stay in Türkiye a maximum of 90 days within 180 days, even if the visa
    itself is valid for longer, such as one year [S4]. Turkish consular offices issue visas with a maximum
    duration of stay of 90 days [S1]. Holding two passports does not get around this: you cannot stay
    90 days on each passport within the same 180 days [S1].


    To stay longer, you need a residence permit:

    - Apply for a "Short Term Residence Permit" at the Provincial Directorate of Migration Administration
    [S1].

    - If you are coming on an education visa, it allows a 90-day stay only, so you must apply for a residence
    permit at e-ikamet.goc.gov.tr to stay beyond that [S8].


    If you overstay your visa, you will have to pay a fine [S3].


    This is not legal advice, and the rules can change. Please confirm your situation with the Presidency
    of Migration Management or a Turkish consulate.'
  sources:
    S1: '\- It is not possible for foreigners holding two passports to stay in Türkiye for 90 days each
      with their two different passports within the last 180 days.


      \- In all types of visa applications, Turkish consular offices may issue visas with a maximum duration
      of stay of 90 days. The foreigners who wish to stay longer than 90 days in Türkiye, should apply
      for “Short Term Residence Permit” at the Provincial Directorate of Migration Administration in order
      to extend their residence.


      \- The residence permit of the foreigners will be cancelled if they stay outside Türkiye for longer
      than 120 days in total during the last year.'
    S2: By issuing a residence permit for the foreigners who will stay in Turkey for more than the maximum
      allowed visa period or visa exemption period, it is aimed to ensure that the visas or visa exemptions,
      which are mostly issued for touristic purposes, are not used for unintended purposes. In this regard,
      if the foreigners, who have completed their 90 days in a 180 day-period, want to stay in our country
      for more than the issued duration, then they are required to apply for one of the residence permit
      types, of which they meet the conditions, and to obtain a residence permit.
    S3: 'Foreigners arriving at our border gates after completing the stay duration of 90 days within
      180 days in Turkey may be allowed to enter into the country if there is not any other obstacle to
      the entry and if they pledge to apply to the Foreigners Department in the province where they will
      stay within ten (10) days to obtain a residence permit as of the date of entry. In this respect,
      the entry procedures will be initiated within the scope of the general provisions for the foreigners
      who accept the conditions stated in the standard form handed to them.


      Those who do not apply for a residence permit within ten days will be regarded as having committed
      a residence permit violation as of the entry date.


      An entry ban order will not be issued against the foreigners who exceed the duration of visa, visa
      exemption or residence permit for more than ten days and arrive at the border gates to exit before
      a removal decision is taken against them. However, the foreigners who violate the mentioned durations
      of visa, visa exemption, work permit or residence permit will pay a fine.'
    S4: '##### I have a one-year visa. Can I stay in Turkey continuously in one-year ?


      You can stay in Turkey maximum 90 days within 180 days with a visa.


      3


      ##### I want to apply for the residence permit but there is no Turkish Consulate in my residence
      country. How may I enter Turkey?


      If you do not have the right for visa exemption, you can enter to Turkey with applying a visa from
      the Turkish Foreign Representative Office in any of third countries.


      4'
    S5: '\- For United Nations (UN) Travel Document (Laissez-Passer) holders who have blue UN travel documents,
      visa exemption with 90 days length of stay within the preceding 180 days may apply during their
      official visit to Türkiye if they can certify their official assignment. Red UN Travel Document
      holders, shall be exempt from entry visa and may stay in Türkiye 90 days within the preceding 180
      days regardless of their purpose of visit. General visa provisions shall apply for Blue UN travel
      document holders subject to regulations specified according to their country of origin.


      \- Visa applications for travels except for touristic or trade purposes (work or study etc.) will
      need to obtain visa through Turkish Representations in the abroad.


      \- Regardless of the visa regime applied towards the citizens of a country, the travel document
      holders of that country need to obtain visa from Turkish missions beforehand.'
    S6: 'Example A: In order to enter Türkiye having a visa with 90 days “duration of stay”, foreigners
      should hold a travel document valid at least for an additional 60 days which totals to 150 days
      (90 days + 60 days) of validity at the time of entrance.


      Example B: In order to enter Türkiye having a visa with 30 days “duration of stay”, foreigners should
      hold a travel document valid at least for an additional 60 days which totals to 90 days (30 days
      + 60 days) of validity at the time of entrance."


      The following categories are exempted from this provision:


      \- Citizens of countries who are allowed to enter Türkiye with their national ID’s in accordance
      with “European Agreement on Regulations governing the Movement of Persons between Member States
      of the Council of Europe”,


      Holders of diplomatic and official passports are also exempted from this Article.'
    S7: '**Slovakia**: Ordinary passport holders are exempt from visa for their travels to Türkiye with
      touristic purposes up to 90 days within 180 days, starting from the first entry date. Official passport
      holders are exempt from visa for their travels up to 90 days within 180 days, starting from the
      first entry date.


      **Slovenia**: Ordinary passport holders are exempted from visa for their travels to Türkiye with
      touristic purposes up to 90 days within 180 days, starting from the first entry date. Official passport
      holders are exempted from visa for their travels to Türkiye up to 90 days within six months.


      **Solomon Islands**: Ordinary and official passport holders are required to have visa to enter Türkiye.
      Ordinary and official passport holders can get their visas from Turkish diplomatic or consular representations
      abroad. Ordinary passport holders who hold a valid Schengen members or USA, UK, Ireland visa or
      residence permit may get their visas via the website www.evisa.gov.tr provided that they meet certain
      conditions.


      **Somalia**: Ordinary and official passport holders are required to have visa to enter Türkiye.'
    S8: 'Important notes:

      • Your education visa will have 90-day stay only. You must apply for a residence permit

      on https://e-ikamet.goc.gov.tr which will allow you to stay beyond that period.

      • In individual cases, you may be required to provide additional documents.

      • Please do not finalize your travel arrangements until you are notified about the

      outcome of your visa application.

      • It is strongly advised for applicants to apply at least one month prior to their intended

      trip.

      • Turkish Consulate in New York cannot expedite a visa application.'
