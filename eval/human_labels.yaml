# Human labels for checking the LLM judge. Label BEFORE looking at the judge's output.
#
# faithful:    yes = every factual claim in `answer` is stated in `sources`
#              no  = at least one claim is not stated there (even if true in reality)
# correctness: compare `answer` with `reference_answer`
#              correct   = all key facts, nothing contradicting
#              partial   = some key facts / vaguer, nothing contradicting
#              incorrect = contradicts a key fact, wrong number/rule, or doesn't answer
#              (leave as n/a for unanswerable questions)

# faithful_shared_def: derived from the labeller's own notes under the shared definition
# (judge rubric v3). The original `faithful` labels are unchanged.

- id: q002
  question: Can international students in Türkiye work part-time, and does it depend on whether they are
    bachelor's or master's students?
  reference_answer: Associate and undergraduate students can work part-time only after completing their
    first year of study; graduate students are not subject to that first-year restriction. A work permit
    is still required.
  answer: 'Yes, but not on your student residence permit alone: you first need a separate work permit
    [S1][S3]. According to METU, you cannot apply for it yourself; you first find a job, and the employer
    applies for your permit [S3]. The rules do depend on your level of study. If you are an associate
    or bachelor''s student, you can work part-time only after completing your first year [S2][S3]. If
    you are a master''s or PhD student, that first-year limit does not apply [S2]; you can get a permit
    from your first year, for full-time or part-time jobs [S3]. Graduate students may also work as researchers
    in projects related to their studies [S1]. METU states that permits at both levels are only for jobs
    outside the university or campus [S3]. Applications for unrelated jobs in entertainment or domestic
    work are evaluated negatively [S2]. If you are a Türkiye Scholarships holder, the YTB is consulted
    [S2]. Rules can change, so confirm with the Ministry of Labour or your university''s international
    office.'
  sources:
    S1: '**Working while studying**


      In particular, international students enrolled in a master''s or PhD program in Türkiye can work
      as researchers in scientific projects related to their work to finance their graduate studies. Some
      private universities also accept graduate students with full scholarships and can provide assistantships
      for students in exchange for this scholarship. Undergraduate students will often find opportunities
      to work in a part-time job, according to their course schedules.


      If you have a plan to work in your student life, what you need to know first is that your student
      residence permit does not cover the work permit alone. Therefore, if you want to work during your
      studies, you will first need to obtain a work permit. There are different types of work permits
      such as short-term, perpetual, independent work and are given by General Directorate of International
      Labour.'
    S2: '**9. Foreign students**


      9.1. Foreign students who are enrolled in associate and undergraduate degree programs at a higher
      education institution in Türkiye can work part-time after completing their first year of study.


      9.2. Work permit applications for graduate students enrolled in formal education programs will not
      be subject to the limitations mentioned in the first paragraph.


      9.3. The status of the foreigner as a student will be verified based on the records of the Council
      of Higher Education (Yükseköğretim Kurulu - YÖK).


      9.4. Work permit applications for foreign students wishing to work in jobs unrelated to their field
      of study in entertainment or domestic work industry will be evaluated negatively.


      9.5. In evaluating work permit applications for foreign students enrolled in associate and undergraduate
      degree programs, factors such as the city in which the student is studying will be considered.


      9.6. For foreign students studying under the Türkiye Scholarships Program (Türkiye Bursları), the
      opinion of the Presidency for Turks Abroad and Related Communities (Yurtdışı Türkler ve Akraba Topluluklar
      Başkanlığı) will be sought in evaluating work permit applications.'
    S3: '## Work Permits


      ## Students:


      **Your residence permit does not automatically give you the right to work in Türkiye.** You need
      an official work permit to work in Türkiye. The work permit is not something individuals can apply
      for individually. The company that wants to hire you should apply for your work permit. In other
      words, inTürkiye, you first need to find a job, and then the company should apply for a work permit
      for you.


      - Students at the undergraduate level can only get a work permit after they complete their first
      year at the university.

      - Students at the undergraduate level can only get a work permit for part-time jobs.

      - Students at the undergraduate level can only get a work permit for jobs outside of the university/campus.


      - Students at the graduate level can get a work permit starting from their first year at the university.

      - Students at the graduate level can get a work permit for both full-time and part-time jobs.

      - Students at the graduate level can only get a work permit for jobs outside of the university/campus.'
    S4: International students have a variety of options to meet their accommodation needs throughout
      their educational life in Türkiye. Students can stay in university dormitories located within the
      campuses, in state dormitories managed by the KYK (Higher Education Credit and Hostels Institution)
      located at various points in the city, in private dormitories, or in the apartments they rent in
      the city.
    S5: '## Rules for part time jobs in Germany


      Labour regulations for international students are very strict. So it is important to know them.
      Violators can be expelled. As an international student, your permitted working hours depend on whether
      you are from the EU (including Iceland, Liechtenstein, Norway and Switzerland) or not.


      The provision on secondary employment is very closely linked to the residence title. Therefore,
      check exactly which regulations apply to you.'
    S6: '**EQUIVALENCE**: It is the determination of equivalence of associate degree, undergraduate and
      master''s diplomas obtained from overseas higher education institutions and programs to Associate
      degree, Bachelor’s and Master''s degrees awarded by higher education institutions in Türkiye in
      terms of achievements in related education level. Academic level of graduated higher education program,
      the degree and the qualification, the total of national credits and/or ECTS required for graduation
      are evaluated in terms of knowledge, skills and competencies that need to be gained.


      <u>Diploma Equivalence Certificate:</u> Those who want to perform professions according to their
      graduated International Higher Education program and those who graduated from health fields (compulsory)
      and who want to have a Master''s or PhD education in Türkiye can use this document.


      <u>Graduation Recognition Certificate:</u> Only those who want to document "Higher Education Graduation"
      as a result of evaluation of academic degrees without evaluation of vocational achievements.


      For Diploma Equivalence and Graduation Recognition documents, pre-applications must be made at the
      following web site addresses.


      Turkish citizens: https://www.turkiye.gov.tr/yok-denklik-basvurusu


      Foreign nationals: http://denklikbasvuru.yok.gov.tr/denklik/yu-denklik-basvuru-form'
    S7: 'and freedom of establishment and may work self-employed or for an

      employer without restriction.

      3.2

      Students from non-EU states

      International students (as well as Studienkolleg participants) from non-EU

      countries are allowed to work but must follow several rules. As an international

      student you are allowed to work part-time from the first year of your preparatory

      programme (language course, preparatory college, preparatory course, etc.).

      The rules that apply in this context are the following:

      “Employment of up to 140 days in accordance with § 16b (3) AufenthG and part-time

      on-campus student work is allowed.”

      3.2.1 140-day rule

      International students from non-EU states may work 140 days or 280 half-days per

      year without needing the approval of the Employment Agency.

      The 140 full days refer to your workday account. The calculation is taken with

      reference to the current calendar year.

      Your workday account can also be filled with half days. You can decide for each

      calendar week how your workday account is to be filled. The following options are

      available:

      1. working hours of up to four hours a day count as a half day if the usual daily

      working time totals eight hours (the maximum duration for a half day is'
    S8: 'These students studying in Türkiye are of great importance in building bridges of friendship
      between countries. Today, there are international graduates from Turkish universities in 194 countries.
      These individuals have carried the knowledge and skills they acquired in our country into the future
      in a way that contributes positively to our relations with their own countries.


      We strongly urge the public to trust the information shared transparently by official institutions
      and not to give credence to baseless claims that seek to harm our country''s education system and
      international relations.'
