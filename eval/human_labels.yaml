- id: q018
  question: How long might it take for Sabancı applicants to receive a decision and residence permit card?
  reference_answer: The university says evaluation and card preparation may take up to 90 days; it also
    gives a 30–90 day range for notification.
  answer: 'You can expect a processing time of about 30–90 days after your application is received for
    evaluation, according to the Directorate General of Migration Management''s rules [S1]. After you
    submit your documents to the IRO, your file goes to the Istanbul Provincial Immigration Administration,
    and the result is sent to you within 30–90 days by email/SMS and on the e-ikamet website [S2]. It
    may take up to 90 days for approval and card preparation [S2]. The same timeline applies to extensions
    and exchange students [S3][S4].


    Key points:

    - The IRO does not receive results, so check the website regularly [S2].

    - Cards go to the address on your address document; tracking is your responsibility [S2].

    - If you gave the Tuzla Campus address, the Communication Center will notify you when your card arrives
    [S2].

    - After receiving it, send a copy to irolegal@sabanciuniv.edu and studentinfo@sabanciuniv.edu [S2].


    Timelines can change; confirm with the migration authority.'
  sources:
    S1: '**How long will it take to receive my student residence permit card?**


      According to the decisions and rules of the Directorate General of Migration Management, there is
      a processing time of 30-90 days after your application is received for evaluation.'
    S2: '#### Step 6: Tracking your Residence Permit Card


      After you submit your documents to IRO, we will deliver your file to the Istanbul Provincial Immigration
      Administration. The evaluation result will be delivered to the student within 30-90 days via email/SMS
      and Immigration Office website https://e-ikamet.goc.gov.tr/Ikamet/DevamEdenBasvuruGiris


      The authority to evaluate and announce results lies with the Directorate General of Migration Management.
      The IRO does not receive application results. Therefore, we recommend regularly checking the website
      for updates.


      It may take up to 90 days for your application to be approved and for your cards to be prepared.
      Your cards will be sent to the addresses listed on the address document you provided in your application.
      Tracking the cards is the student''s personal responsibility.


      If you provided Sabancı University Tuzla Campus as your address in your residence permit application
      form, your card will be sent to the Communication Center on campus. You will be notified by the
      Communication Center once your card arrives.


      After receiving your card, please don''t forget to send a copy to irolegal@sabanciuniv.edu and studentinfo@sabanciuniv.edu.'
    S3: '#### Step 6: Tracking your Residence Permit Card


      After you submit your documents to IRO, we will deliver your file to the Istanbul Provincial Immigration
      Administration. The evaluation result will be delivered to the student within 30-90 days via email/SMS
      and Immigration Office website https://e-ikamet.goc.gov.tr/Ikamet/DevamEdenBasvuruGiris


      The authority to evaluate and announce results lies with the Directorate General of Migration Management.
      The IRO does not receive application results. Therefore, we recommend regularly checking the website
      for updates.


      It may take up to 90 days for your application to be approved and for your cards to be prepared.
      Your cards will be sent to the addresses listed on the address document you provided in your application.
      Tracking the cards is the student''s personal responsibility.


      If you provided Sabancı University Tuzla Campus as your address in your residence permit application
      form, your card will be sent to the Communication Center on campus. You will be notified by the
      Communication Center once your card arrives.


      After receiving your card, please don''t forget to send a copy to irolegal@sabanciuniv.edu and studentinfo@sabanciuniv.edu.'
    S4: '#### Step 6: Tracking your Residence Permit Card


      **\*\*\*Submit your all documents to IRO between 21st March 2025\*\***


      After you submit your documents to IRO, we will deliver your file to the Istanbul Provincial Immigration
      Administration. The evaluation result will be delivered to the student within 30-90 days via email/SMS
      and Immigration Office website https://e-ikamet.goc.gov.tr/Ikamet/DevamEdenBasvuruGiris


      The authority to evaluate and announce results lies with the Directorate General of Migration Management.
      The IRO does not receive application results. Therefore, we recommend regularly checking the website
      for updates.


      It may take up to 90 days for your application to be approved and for your cards to be prepared.
      Your cards will be sent to the addresses listed on the address document you provided in your application.
      Tracking the cards is the student''s personal responsibility.


      If you provided Sabancı University Tuzla Campus as your address in your residence permit application
      form, your card will be sent to the Communication Center on campus. You will be notified by the
      Communication Center once your card arrives.


      After receiving your card, please don''t forget to send a copy to irolegal@sabanciuniv.edu and studentinfo@sabanciuniv.edu.'
    S5: '#### Address Registration


      Individuals who have a residence permit card must register their address within 20 days of receiving
      their card. Additionally, if your current address changes, you must register your new address as
      well. Erasmus and Exchange Program students can skip this step if they will not extend their permits
      in Turkey.


      You must book an appointment through Immigration Office Appointment System to register your address.
      It is mandatory to go to the immigration office on the appointment day for address registration.


      In order to book an appointment, you need to have an e-devlet access and follow this guide.


      Below you will find the required documents for the process. After reviewing and collecting the required
      documents *according to where you stay*, you can book your appointment and register your address
      at the Immigration Office in person.'
    S6: 'To apply for this type of permit, if your current card has not expired, you can apply for a transfer
      on the official website a couple of days before your official graduation date. However, if your
      card has expired and the period you have stayed in the country does not exceed 10 days, you may
      need to make a first application for a short-term residence permit and select ''graduation'' as
      the reason. The important thing here is to apply within 6 months after graduation. Additionally,
      if you apply after your residence permit card has expired and this exceeds 10 days, the Directorate
      General of Migration Management may negatively evaluate your application or require you to leave
      and re-enter Turkey. Therefore, the expiration date of your current card and your graduation dates
      are very important in your application. This is why we recommend applying for this type of permit
      before your current card expires.


      **Application link for the transfer application to a short-term residence permit:**https://e-ikamet.goc.gov.tr/Ikamet/UzatmaGecisGiris/GecisBasvuru


      This situation DOES NOT apply to the students who cancel their registration, the students who freeze
      their registration, the students who have a hold, or the students who have dismissal from the university.'
    S7: '#### Residence Permit After Graduation


      As is known, after your graduation, you must leave Turkey within 10 days after the expiration date
      of your student residence permit card. However, some of our students wish to stay in Turkey for
      reasons such as finding a job or continuing their education. To enable these students to stay in
      Turkey legally without needing to leave the country, all our full-time students who meet the condition
      of **having graduated within the last 6 months** from the university can apply for a short-term
      residence permit transition from a student residence permit. In this way, you can get a short-term
      residence permit for about up to 1 year. We briefly mention the general information on the issue
      here. However, you can call 157 for the details and the best answers.'
    S8: 'Note: We have been informed that if students'' current residence permits extend beyond their
      graduation date, these permits will remain active. However, we do not know how long they will remain
      active, and it is generally understood that residence permits may be canceled within 90 days after
      graduation. Therefore, we recommend that you apply for a short-term residence permit 5 days before
      your graduation date, which you can find out from student resources. You can check the status of
      your permit by calling 157.'
  faithful: 'no'
  correctness: correct
  note: “The same timeline applies to extensions and exchange students” — I did not find explicit support
    for this in S3/S4.
  faithful_shared_def: 'yes'
  shared_def_reason: only issue was supported by source title/date, which the first sheet did not show
- id: q021
  question: What is the Turkish foreign national identity number used for at METU besides identifying
    me?
  reference_answer: METU uses it in its Student Affairs Information System; without one, students cannot
    see grades, obtain student certificates, or graduate.
  answer: At METU, your foreign national identity number is used in the Student Affairs Information System
    (SAIS). SAIS requires it when you request your end-of-semester grades, when you request a student
    certificate, and when you graduate [S1]. Without it, you won't be able to see your grades, get student
    certificates or graduate [S1]. If you haven't submitted it yet, give it to the responsible International
    Students' advisor at the Registrar's Office [S1]. You can find the number on your residence permit
    card, or look it up at https://tckimlik.nvi.gov.tr/ [S1]. The number also matters for health insurance.
    If you want General Health Insurance (GSS), you must apply immediately after getting the number [S1].
    The GSS application needs a student certificate showing your foreigner identification number [S3].
    This isn't legal advice, so please confirm the details with METU's Registrar's Office.
  sources:
    S1: '## Foreign National Identity Number


      Every foreign resident, just like any Turkish citizen, has an identity number issued by the Turkish
      authorities. This number is also used in METU’s Student Affairs Information System (SAIS). METU
      SAIS requires this number when


      1. you request to learn your grades at the end of the semester,

      2. you request a student certificate,

      3. you graduate.


      In other words, students who do not have this number will not be able to learn their grades, get
      student certificates or graduate. For this reason, those who have not submitted their Foreign National
      Identity numbers previously, need to submit the number to the International Students'' advisors
      who is responsible (see for a list of advisors of Registrar’s Office, http://oidb.metu.edu.tr/en/personnel-contact-information).


      Foreign national identity number is written on your residence permit card. Alternatively, you can
      search it from https://tckimlik.nvi.gov.tr/.


      **WARNING**: Those who want to benefit from the General Health Insurance services must apply immediately
      after getting the foreign national id number.'
    S2: 'b. “No, I am outside Türkiye” — with this option,

      the foreign national can log in to the system

      using the 16-digit reference number obtained

      from a Turkish foreign mission, together with

      their passport information.


      WORK PERMIT EXEMPTION

      APPLICATION GUIDE

      3


      Once the information is verified and the user logs in to the system, an e-mail verification screen
      appears

      for users without an existing registration. The OTP code sent to the e-mail address is entered into
      the

      system to complete verification.


      If the user''s profile has not been created yet, the system redirects to the Personal Information
      section.

      While Turkish citizen users only need to complete and verify the Contact Information section, foreign

      nationals applying for a Work Permit Exemption must complete the identity, photo, contact, passport,

      education, and career information fields.


      WORK PERMIT EXEMPTION

      APPLICATION GUIDE

      4


      2. ENTERING USER INFORMATION

      2.1. Personal Information'
    S3: '#### How to Apply


      **Step 1: Collect the required documents**


      - Passport

      - Residence Permit Card (if available)

      - Student Certificate showing your foreigner identification number and the start date of the academic
      year. You can obtain this document through the METU Student Portal or by visiting the Registrar''s
      Office.'
    S4: '1. A portrait photo

      2. Official Identification Document (Applicants holding a passport need to upload the ID page of
