- id: q091
  question: I'm applying for a German student visa in Bangladesh. How long does processing take, and how
    early can I apply?
  reference_answer: Processing takes at least about 4 weeks, and the visa can only be issued within 3
    months of your arrival date.
  answer: Processing takes at least about 4 weeks, and you can apply no more than 3 months before your
    arrival in Germany. The German Embassy Dhaka states that the minimum time to process your visa is
    approx. 4 weeks, and that the visa can only be provided within 3 months of your arrival date, so you
    should not make requests if your arrival is more than 3 months away [S1]. Within that window, apply
    in good time [S1]. Before you submit, you must register for an online appointment, which applies to
    all study purposes [S2]. Only complete applications are accepted [S2]. You can apply at the Dhaka
    Embassy only if your permanent residence is in its area of jurisdiction [S2]. Other German missions
    give different processing times, from about two weeks to four to six weeks [S4][S5], but the Dhaka
    source is the one that applies to you. This is not legal advice, so please confirm current timings
    with the Embassy.
  sources:
    S1: 'Schengen visa and a National visa cannot be processed.

