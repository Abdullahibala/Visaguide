    S4: '## **Processing time:**


      Due to the regular need for approval from the authorities in Germany, you should generally allow
      four to six weeks for your visa application to be processed (calculated from the time you submit
      the complete application documents as well as fees and biometric data and have come in for your
      appointment to the diplomatic mission abroad).


