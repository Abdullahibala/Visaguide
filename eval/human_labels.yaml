      is therefore essential to seek advice from the Studierendenwerk Hamburg (see

      figure. 10.3) before applying for a housing allowance!


      8 see footnote 5

      9you can find out the Foreigners Registration office (Hamburg Service vor Ort) responsible for your
      address

      here: www.hamburg.de/behoerdenfinder


      11'
    S5: '2.2.4 Where and how do I apply for a residence permit

      You can make the initial application for your first residence title (and the initial

      registration of your place of residence) during an appointment with the Hamburg

      Welcome Center8 (please book ahead). The subsequent renewal must be applied for

      at the ‘Hamburg Service vor Ort’ offices.9

      2.2.5 What documents do I need

      

      Fully

      completed

      application

      form.

      (Download:

      https://welcome.hamburg.de/contentblob/103150/f5307b3e9d78264fd8f27e5f748

      8eb87/data/amt-m-m31-antrag-ae-eng-fra.pdf) Can be downloaded on the web site

      https://welcome.hamburg.de/formulare/

      

      Biometrically compliant photograph (no older than six months)

      

      Current registration confirmation

      

      Rental agreement or other proof of accommodation

      

      Current certificate of study/confirmation of enrolment

      

      Proof of financing

      

      Proof of health insurance

      2.2.6 Proof of financing and health insurance

      The proof of financing is required because the right of residence presupposes that

      foreign students are able to finance their own living expense. The application for

      child benefit, parental benefit or advance child support payments such as ‘Kinder-

      / Elterngeld’ or ‘Unterhaltsvorschuss’ is possible under certain conditions and not

      detrimental to your student residence under immigration law.'
    S6: '- The Aliens Registration Office responsible for you depends on your place of residence: Ausländerbehörde
      Stadt Karlsruhe, Ausländerbehörde Landratsamt Karlsruhe (in German)

      - In general: The service phone number of authorities in Karlsruhe is 115 in the fixed network of
      Karlsruhe.

      6. Money in cash: EUR 75.00 to EUR 110.00 depending on the duration of the residence permit.

