- id: q025
  question: If I graduate from a Turkish higher education program and want to remain to look for work,
    what permit might I apply for?
  reference_answer: A short-term residence permit may be available if the application is made within six
    months of graduation; it can be issued once for up to one year.
  answer: 'You can apply for a short-term residence permit under the "those who graduated from a Turkish
    university" category, which gives about one year to look for work in Türkiye [S1][S7]. Key conditions:
    - Apply within six months after graduation [S1][S7]; METU adds that this must be before your student
    residence permit expires [S4]. - If your student card''s expiry date is after your graduation date,
    you may stay until that date [S4]; otherwise you must leave within 10 days after your student card
    expires [S7]. - The permit can be extended for one more year if you apply before it expires or within
    90 days after expiry [S1]. - Each new graduation (undergraduate, master''s, PhD) gives a separate
    right to apply [S4]. Note that to actually work, you need a separate work permit [S6]. These sources
    are university guidance, not legal advice; confirm details with the Migration Office (e.g. by calling
    157) [S7].'
  sources:
    S1: '## After you graduate:


      Turkish laws allow students who graduate from Turkish higher education institutions to get a one-year-long
      residence permit, which could be used as an opportunity to seek for a job in Türkiye. To get this
      type of residence permit, you need to apply for a short-term residence permit within six months
      after your graduation under the "those who graduated from a Turkish university" category.


      After one year, this permit can be extended for an additional one year if the person applies before
      the permit expires or within 90 days after it expires.'
    S2: '##### I''m a student in Turkey. Where can I apply for a work permit?


      Students attending a formal associate, undergraduate, graduate or postgraduate programme in Turkey
      may work provided that they obtain a work permit. However the right of work for associate or undergraduate
      students starts after the first year and is regulated by related law. Applications are made to the
      Ministry of Labor, Social Services and Family.


      10'
    S3: '##### Can graduate or doctoral students apply for a work permit while studying in Turkey?


      Graduate and doctoral students, studying in Turkey, can work if they receive a work permit. Students
      who obtain a work permit are exempted from the obligation to obtain a residence permit during the
      period of work permit. However, the student must obtain a residence permit when the work permit
      expires or is not extended.


      11'
    S4: 'from the program voluntarily or are dismissed from the program is submitted to the Ankara Migration
      Office every semester. Their student residence permits are canceled accordingly. Therefore, students
      must carefully follow their residence procedures.

      7. According to information received from the Migration Office (as of June 2026), when you graduate
      from your program and if your residence permit card''s expiry date is after your graduation date,
      you may stay in Türkiye until the expiry date stated on your card. Those who wish to stay longer
      must apply for a short-term residence permit within six months following graduation, before their
      student residence permit expires. Each new graduation at a higher education level grants a separate
      right to apply for a post-graduation short-term residence permit. Therefore, you may apply for this
      permit after your undergraduate, master''s, and PhD graduations separately.

      8. When applying for an extension, after the positive evaluation of your application, your new card
      will not be printed until your previous card expires. Therefore, if you need proof of your new permit
      before your new card is issued, you may obtain a document via: https://www.turkiye.gov.tr/goc-idaresi-ikamet-izni-kisisel-bilgi-sorgula...

      9. If you wish to leave Türkiye while your residence permit application is under evaluation'
    S5: 'Right of work for (foreign) students


      Foreign students attending an associate, undergraduate, graduate or postgraduate programme in Turkey
      may work, provided that they obtain a work permit. However the right of work for associate or undergraduate
      students starts after the first year (of their study). Work permit applications shall be made to
      the Ministry of Labour and Social Security.


      What Are The Reasons Of Refusal, Cancelation Or Non-Renewal Of Student Residence Permits?


      Under the following cases a student residence permit shall not be issued, be cancelled if has been
      issued, be refused renewal when:


      - The requirements for issuing a student residence permit are not met or no longer apply;


      - Evidence exists that the studies are possibly not to be continued;


      - It is determined that the student residence permit has been used for a purpose other than it is
      issued for;


      - There is a current removal decision or an entry ban to Turkey with respect to the foreigner


      4'
    S6: '**Working while studying**


      In particular, international students enrolled in a master''s or PhD program in Türkiye can work
      as researchers in scientific projects related to their work to finance their graduate studies. Some
      private universities also accept graduate students with full scholarships and can provide assistantships
      for students in exchange for this scholarship. Undergraduate students will often find opportunities
      to work in a part-time job, according to their course schedules.


      If you have a plan to work in your student life, what you need to know first is that your student
      residence permit does not cover the work permit alone. Therefore, if you want to work during your
      studies, you will first need to obtain a work permit. There are different types of work permits
      such as short-term, perpetual, independent work and are given by General Directorate of International
      Labour.'
    S7: '#### Residence Permit After Graduation


      As is known, after your graduation, you must leave Turkey within 10 days after the expiration date
      of your student residence permit card. However, some of our students wish to stay in Turkey for
      reasons such as finding a job or continuing their education. To enable these students to stay in
      Turkey legally without needing to leave the country, all our full-time students who meet the condition
      of **having graduated within the last 6 months** from the university can apply for a short-term
      residence permit transition from a student residence permit. In this way, you can get a short-term
      residence permit for about up to 1 year. We briefly mention the general information on the issue
      here. However, you can call 157 for the details and the best answers.'
    S8: 'The student residence permit will not entitle the parents as well as other family members of
      the foreigner any right to obtain a residence permit. They may apply separately for a residence
      permit if they meet the conditions.


      Foreign students attending a pre-graduate/associate, under¬graduate, graduate or doctorate program
      in Turkey may work, provided that they obtain a work permit. However the right of work for pre-graduate/associate
      or undergraduate students starts after the first year of their study and the weekly working hours
      will not exceed maximum twenty-four hours. The principles and procedures governing the right of
      work for pre-graduate/associate or undergraduate students will be determined separately.'
  faithful: 'no'
  correctness: correct
  note: “These sources are university guidance, not legal advice” — I considered this ungrounded because
    the cited sources include a government source.
  faithful_shared_def: 'no'
- id: q034
  question: If I want to freelance while studying in Germany as an international student, is the usual
    student work allowance enough by itself?
  reference_answer: No. Self-employed or freelance work is only possible if the foreigners authority permits
    it.
  answer: No, not if you are from a non-EU country. The standard allowance of 140 full days or 280 half
    days a year covers ordinary jobs, but self-employed or freelance work is only possible if the Ausländerbehörde
    (foreigners' office) permits it [S3]. The DAAD guide says such work is evaluated case by case [S4].
    In Hamburg, you apply for this permit at the Foreigners Registration Department. It may be granted
    only if it does not jeopardise completing your studies [S1]. Freelancing beyond the 140-day rule is
    usually allowed only for work in a limited timescale [S1]. Freelancing without a permit can bring
    a fine of up to 5,000 euros and put your residence right at risk [S1]. Students from the EU may work
    self-employed without restriction [S8]. The Hamburg details come from one city's guide, so other cities
    may differ. This is not legal advice; please confirm with your local foreigners' office.
  sources:
    S1: 'Registration Department for this.

      Students from non-EU states who wish to work self-employed or as a freelancer

      (e.g. teaching, translating, interpreting, etc.) may apply for a permit for this from

      the Foreigners Registration Department. Self- employment may be allowed during

      studies, but only if this does not jeopardise the completion of the studies (e.g. when

      doing voluntary work in principle similarly to an employee). A permit for working

      self-employed or as a freelancer extending beyond the 140-day rule will usually only

      be granted when this involves work in a limited timescale.

      If you work self-employed or as a freelancer without a permit you are also acting

      improperly and may be fined up to 5000 euros and may be risking your right of

      residence in Germany.

