- id: q055
  question: When I extend my student residence permit in Hamburg, can I show my funds with a normal bank
    account instead of a blocked account?
  reference_answer: Yes. A regular current account showing enough money is sufficient. A blocked account
    is only needed if you apply for a student visa before entering Germany, because the embassy requires
    it.
  answer: Yes. According to the Hamburg guide, your own bank statement can serve as proof of funds if
    it clearly shows you have enough money to support yourself for the period of the residence permit
    you are applying for; a regular current account is sufficient, and a blocked account (Sperrkonto)
    is not required [S1]. The blocked account is only needed if you enter Germany on a student visa, in
    which case the embassy requires proof that one was set up [S1]. The amount you must show is 992 euros
    a month for the whole permit period, i.e. 11,904 euros per year [S8]. In Hamburg, renewals are applied
    for at the 'Hamburg Service vor Ort' offices, and proof of financing is one of the required documents
    [S5]. Note that this guide is from 2024; please confirm current requirements with your Foreigners'
    Registration Office, as this is not legal advice.
