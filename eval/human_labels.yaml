- id: q095
  question: I'm a US citizen admitted to a German university. Do I need a visa before I travel?
  reference_answer: No. US citizens can enter visa-free with a valid passport, but must apply for a residence
    permit for study within the first three months.
  answer: 'No, as a US citizen you generally do not need to apply for a visa before travelling to Germany
    [S1][S2][S6]. You can enter visa-free and apply for the required residence permit for study purposes
    after arrival [S1][S6]. If you stay longer than three months, you apply for this permit at the local
    foreigners authority (Ausländeramt) of your place of residence [S2][S6]. Note: you may only take up
    employment once you have a residence permit that explicitly authorises it; alternatively, you can
    choose to apply for a visa before travelling, which permits employment from the first day of visa
    validity [S8]. The rules can change, so please confirm with the German embassy/consulate or your local
    foreigners authority before making decisions [S5]. This is not legal advice.'
  sources:
    S1: 'Nationals of Australia, Canada, Great Britain, Israel, Japan, New Zealand, South Korea and the
