      • applied for and received a visa for entry, traveled, but have left Germany again before receiving
      a residence permit from the Aliens Office.'
    S8: 'In order to prove your livelihood, you must explain to the Foreigners’ Registration

      Office, from which sources you finance your studies. According to the BAföG

      (German law on student financing), you must have available funds of 992 euros a

      month.

      This monthly sum applies to the entire period for which you hold a residence permit,

      i.e. normally for at least one year. The annual equivalent is 11,904 euros per year.


