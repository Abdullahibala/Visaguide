      1\. who have permission to remain pending the asylum decision,


      2\. whose deportation has been suspended under section 60a (2) sentence 3, or


      3\. who have a temporary residence permit pursuant to section 24 or 25 (5).


      Section 44a


      Obligation to attend an integration course


      (1) Foreigners are required to take an integration course if


      1\. they are entitled to attend under section 44 and


      a) they are unable to communicate at least at a basic level in the German language or


      b) they do not have a sufficient command of the German language at the time a residence title is
      issued under section 23 (2), section 28 (1) sentence 1 no. 1, section 30 or section 36a (1) sentence
