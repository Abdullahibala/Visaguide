      activities must promise at least as much income as you need to independently

      ensure your means of subsistence (standard rate of unemployment benefit,

      Bürgergeld, according to SGB II plus the actual costs of your accommodation and

      at least 100 euros for allowances (see Part-time posts) as well as health and care

      insurance).

      Self-employed and freelance workers are legally obliged in Germany to take out

      sufficient health and long term care insurance (Pflegeversicherung) whose scope of

      benefits corresponds roughly to that of the statutory health insurance in Germany.

      Before concluding such insurance you should seek advice from an independent body

      such as Studierendenwerk Hamburg (see A below). Freelance artists may get

      insurance at the Künstlersozialkasse (KSK).19

