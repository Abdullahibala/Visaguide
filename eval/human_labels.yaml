- id: q094
  question: Who applies for my work permit in Türkiye, me or my employer?
  reference_answer: 'The employer. You can''t apply yourself: you find a job first, then the company applies
    for your work permit.'
  answer: 'Your employer applies, not you. As a student, a work permit is not something you can apply
    for individually; the company that wants to hire you applies for your work permit, so you first need
    to find a job [S6]. The MFA describes a process where you apply at the nearest Turkish mission with
    your passport, visa application form and a letter from your employer, and your employer then submits
    the other documents to the Ministry of Labour and Social Security within ten working days [S2][S3].
    The Ministry finalizes applications within thirty days at the latest [S2].


    Key conditions for students: undergraduates can get a permit only after their first year and only
    for part-time jobs off campus; graduate students can from their first year, full- or part-time, off
    campus [S6]. Your residence permit alone does not give you the right to work [S6].


    This is not legal advice; please confirm with the Ministry of Labour or your university''s international
    office.'
  sources:
    S1: '3. CREATING A WORKPLACE PROFILE

      f the foreigner who will work under a work permit exemption works affiliated with an employer registered

