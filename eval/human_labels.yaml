- id: q092
  question: My department in Türkiye requires a compulsory internship. Do I need a work permit for it?
  reference_answer: You apply for a work permit exemption instead, which covers internships required by
    your university programme.
  answer: You do not need a regular work permit, but according to the Ministry of Labour you do need to
    apply for a work permit exemption for a compulsory internship [S1]. Under Article 48 of the Implementing
    Regulation, this exemption can be issued to foreign students enrolled in a formal education program
    in Türkiye who must do an internship with an employer during the compulsory internship [S1]. Study
    in Türkiye simply says you do not need a work permit for compulsory or elective internships, and that
    your university can guide you to internship opportunities [S2]. These sources differ slightly. Both
    were retrieved on the same date, but the Ministry of Labour is the responsible authority, so plan
    on applying for the exemption [S1]. This is not legal advice, and rules can change. Confirm the procedure
    with your university's international office and the Ministry of Labour.
  sources:
    S1: '##### I am a foreigner, I am a student at a university in Türkiye, I have a compulsory internship
      due to the department I am studying, do I need a work permit for this?


      It is necessary to apply for work permit exemption for internships that are required as a part of
      university education. In accordance with Article 48 of the Implementing Regulation, a work permit
      exemption can be issued for "foreign students enrolled in a formal education program in Türkiye
      who are obliged to do an internship with an employer within the scope of vocational training in
      accordance with the relevant legislation, during the compulsory internship".'
    S2: '**Internship Opportunities**


      Higher education program you are enrolled in Türkiye may be a compulsory or elective internship
      activity. This type of internship activities, which are mostly seen in undergraduate programs, are
      usually conducted during summer term. In this case, you do not need to get a work permit, and with
      the guidance of your university, you can find opportunities for internships in many private companies,
      government organizations, international organizations or NGOs in Türkiye.


      You can also have the opportunity to do internship for 2-12 months in a European country under Erasmus
      + programme, which is open to participants from all over the world during your study in Türkiye
      or immediately after graduation. Don''t forget to be in close contact with the International Office
      of your University for this!


      https://ec.europa.eu/programmes/erasmus-plus/opportunities/traineeships-students\_en


      If you are a student enrolled in a university abroad and are planning to come to Türkiye for internship,
      it is good to know that you are exempt from the work permit within certain conditions.'
    S3: '## Work Permits


      ## Students:


      **Your residence permit does not automatically give you the right to work in Türkiye.** You need
      an official work permit to work in Türkiye. The work permit is not something individuals can apply
      for individually. The company that wants to hire you should apply for your work permit. In other
      words, inTürkiye, you first need to find a job, and then the company should apply for a work permit
      for you.


      - Students at the undergraduate level can only get a work permit after they complete their first
      year at the university.

      - Students at the undergraduate level can only get a work permit for part-time jobs.

      - Students at the undergraduate level can only get a work permit for jobs outside of the university/campus.


      - Students at the graduate level can get a work permit starting from their first year at the university.

      - Students at the graduate level can get a work permit for both full-time and part-time jobs.

      - Students at the graduate level can only get a work permit for jobs outside of the university/campus.'
    S4: 'Once you get a work permit in Türkiye, that permit is counted as a residence permit, and you
      do not need to apply for a residence permit until the expiry date of your work permit.


      If it is found out that you work in Türkiye without an official work permit, your residence permit
      could be canceled by the Migration Office.'
    S5: '#### Special work, internship, research or qualification visas


      You **cannot** use the Consular Services Portal for **non-skilled worker visas**. For special work
      visas such as **non-skilled employment (§15d BeschV), working on ships, freelancer, artist or au-pair,
      for a voluntary service, internship, recognition of your foreign qualifications (§16d AufenthG),
      self-employment or research** please book an appointment through iDATA and prepare your documents
      according to the information on national visas for Turkish citizens (German/Turkish).'
    S6: '**Working while studying**


      In particular, international students enrolled in a master''s or PhD program in Türkiye can work
      as researchers in scientific projects related to their work to finance their graduate studies. Some
      private universities also accept graduate students with full scholarships and can provide assistantships
      for students in exchange for this scholarship. Undergraduate students will often find opportunities
      to work in a part-time job, according to their course schedules.


      If you have a plan to work in your student life, what you need to know first is that your student
      residence permit does not cover the work permit alone. Therefore, if you want to work during your
      studies, you will first need to obtain a work permit. There are different types of work permits
      such as short-term, perpetual, independent work and are given by General Directorate of International
      Labour.'
    S7: '\- To work in Türkiye, you must apply to the nearest Turkish mission to obtain work permit and
      visa. Your passport, visa application form and a letter from your employer are the necessary documents
      for your application. Other documents should be submitted to the Turkish Ministry of Labor and Social
      Security (MLSS) by your employer within ten working days after your application.


      \- Work Permit Applications are concluded positively or negatively by the Ministry of Labor and
      Social Security. Work Permits have equivalence to residence permits. Thus, should a working permit
      is approved by the Ministry, the foreigner is charged an Entry Visa Fee, Work Permit Certificate
      Fee and Residence Fee by the Turkish consular offices. Since Work Permit Card substitute residence
      permit in Türkiye, "Work Annotated Visa" issued by these offices can only be used for entrance and
      for 90 days at maximum.


      \- You may find the list of those documents in the MLSS’s website ( http://www.csgb.gov.tr ). Applications
      are finalized by the MLSS within thirty days at the latest. Right after your arrival in Türkiye
      (before starting to work), you should be registered at the local police department within one month
      to obtain the necessary residence permit.'
    S8: 'Information on Work Visa: To work in Türkiye, you must apply to the nearest Turkish mission to
