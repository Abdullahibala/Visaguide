- id: q040
  question: I have a Türkiye scholarship but no Turkish proficiency certificate. What language support
    may be offered?
  reference_answer: A one-year language preparation program is offered to students admitted to Turkish
    higher education programs without a Turkish proficiency certificate.
  answer: With a Türkiye Scholarship, you can study a 1-year Turkish language course, which is part of
    the programme [S4]. The Türkiye Scholarships website presents this course as a standard benefit; it
    does not say it depends on whether you lack a Turkish Proficiency Certificate [S4]. If you are instead
    on the separate CoHE (YÖK) Scholarship, a one-year language preparation is offered when admitted students
    do not have a Turkish Proficiency Certificate [S1]. That scholarship also covers Turkish language
    tuition costs for non-Turkish scholars [S2]. Separately, some universities in Türkiye offer Turkish
    language training [S3]. Note that individual universities may limit which certificates they accept
    later. For example, ITU accepts only certificates from ITU TÖMER or the Yunus Emre Institute [S6].
    This is not legal advice, so please confirm the details with Türkiye Scholarships and your university.
